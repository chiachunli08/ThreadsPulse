name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_VERSION: '16.5'
  MIN_IOS: '15.0'

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.theos.outputs.version }}
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 安裝 Theos
        id: theos
        uses: ./.github/actions/setup-theos
        with:
          sdk-version: ${{ env.SDK_VERSION }}

      - name: 編譯
        env:
          VERSION: ${{ steps.theos.outputs.version }}
        run: |
          set -e
          MAKE="gmake FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:${MIN_IOS}"
          mkdir -p dist

          $MAKE clean
          $MAKE package THEOS_PACKAGE_SCHEME=rootless THEOS_PACKAGE_DIR=build/rootless
          cp build/rootless/*.deb "dist/ThreadsPulse_rootless_${VERSION}.deb"

          $MAKE clean
          cp control control.orig
          perl -pi -e 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm/' control
          $MAKE package THEOS_PACKAGE_DIR=build/rootful
          mv control.orig control
          cp build/rootful/*.deb "dist/ThreadsPulse_rootful_${VERSION}.deb"

          $MAKE clean
          cp control control.orig
          perl -pi -e 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' control
          $MAKE package THEOS_PACKAGE_DIR=build/roothide
          mv control.orig control
          cp build/roothide/*.deb "dist/ThreadsPulse_roothide_${VERSION}.deb"

          mkdir -p build/trollfools
          cp .theos/obj/ThreadsPulse.dylib build/trollfools/
          cp -R "layout/Library/Application Support/ThreadsPulse/ThreadsPulse.bundle" build/trollfools/
          $MAKE -C OpenThreadsSafariExtension
          cp -R OpenThreadsSafariExtension/.theos/obj/OpenThreadsSafariExtension.appex build/trollfools/
          (cd build/trollfools && zip -qry "../../dist/ThreadsPulse_TrollFools_${VERSION}.zip" \
              ThreadsPulse.dylib ThreadsPulse.bundle OpenThreadsSafariExtension.appex)

          ls -la dist

      - name: 上傳 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsPulse_${{ steps.theos.outputs.version }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下載編譯結果
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 建立 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThreadsPulse ${{ needs.build.outputs.version }}
          files: dist/*
