name: Build IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download link to a decrypted Threads IPA (leave empty to use the DECRYPTED_IPA_URL secret)｜已解密 Threads IPA 的直接下載網址（留空則使用 Secret：DECRYPTED_IPA_URL）'
        required: false
        default: ''
      variant:
        description: 'sideload = certificate signing (with Safari extension); noplugins = SideStore / AltStore free account｜sideload＝證書簽名（含 Safari 延伸功能）；noplugins＝SideStore / AltStore 免費帳號'
        type: choice
        options:
          - both
          - sideload
          - noplugins
        default: both
      release_tag:
        description: 'Optional new tag to publish the IPA as a GitHub Release; leave empty for artifacts only｜選填新標籤以發布 IPA；留空只上傳 Artifact'
        required: false
        default: ''

permissions:
  contents: write

env:
  SDK_VERSION: '16.5'
  MIN_IOS: '15.0'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 驗證 Release 標籤
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo '::error::Release 標籤須以 v 和數字開頭，並只包含英數、點、底線或連字號。'
            exit 1
          fi
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo '::error::此標籤已存在，請使用新標籤。'
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo '::error::無法檢查遠端標籤。'
            exit 1
          fi

      - name: 確認 IPA 網址
        env:
          INPUT_URL: ${{ inputs.ipa_url }}
          SECRET_URL: ${{ secrets.DECRYPTED_IPA_URL }}
        run: |
          URL="${INPUT_URL:-$SECRET_URL}"
          if [ -z "$URL" ]; then
            echo "::error::請在「ipa_url」填入已解密 Threads IPA 的下載網址，或設定 Secret：DECRYPTED_IPA_URL"
            exit 1
          fi
          echo "::add-mask::$URL"
          echo "IPA_URL=$URL" >> "$GITHUB_ENV"

      - name: 下載 Threads IPA
        run: |
          curl -fL --retry 3 -o Threads.ipa "$IPA_URL"
          if ! unzip -l Threads.ipa | grep -q 'Payload/.*\.app/Info.plist'; then
            echo "::error::下載的檔案不是 IPA。請確認網址是「直接下載」連結，不是網頁。"
            exit 1
          fi
          ls -lh Threads.ipa

      - name: 安裝 Theos
        id: theos
        uses: ./.github/actions/setup-theos
        with:
          sdk-version: ${{ env.SDK_VERSION }}

      - name: 編譯 ThreadsPulse 與 Safari 延伸功能
        run: |
          MAKE="gmake FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:${MIN_IOS}"
          $MAKE
          $MAKE -C OpenThreadsSafariExtension

      - name: 注入 IPA
        id: inject
        env:
          VARIANT: ${{ inputs.variant }}
          TP_VERSION: ${{ steps.theos.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          BUNDLE="layout/Library/Application Support/ThreadsPulse/ThreadsPulse.bundle"
          inject() {
            local name="$1"; shift
            python3 -I scripts/inject_ipa.py -i Threads.ipa \
              -d .theos/obj/ThreadsPulse.dylib -b "$BUNDLE" \
              -o "dist/$name.ipa" --github-output "$GITHUB_OUTPUT" "$@"
          }
          if [ "$VARIANT" = "both" ] || [ "$VARIANT" = "sideload" ]; then
            inject sideload --appex OpenThreadsSafariExtension/.theos/obj/OpenThreadsSafariExtension.appex
          fi
          if [ "$VARIANT" = "both" ] || [ "$VARIANT" = "noplugins" ]; then
            inject noplugins --no-plugins
          fi

      - name: 整理檔名
        env:
          TP_VERSION: ${{ steps.theos.outputs.version }}
          THREADS_VERSION: ${{ steps.inject.outputs.threads_version }}
        run: |
          cd dist
          for f in *.ipa; do
            mv "$f" "Threads_${THREADS_VERSION}_Pulse_${TP_VERSION}_${f%.ipa}.ipa"
          done
          rm -f ../Threads.ipa
          ls -la

      - name: 上傳 sideload 版
        if: inputs.variant != 'noplugins'
        uses: actions/upload-artifact@v4
        with:
          name: Threads_${{ steps.inject.outputs.threads_version }}_Pulse_${{ steps.theos.outputs.version }}_sideload
          path: dist/*_sideload.ipa
          retention-days: 3
          compression-level: 0

      - name: 上傳 noplugins 版
        if: inputs.variant != 'sideload'
        uses: actions/upload-artifact@v4
        with:
          name: Threads_${{ steps.inject.outputs.threads_version }}_Pulse_${{ steps.theos.outputs.version }}_noplugins
          path: dist/*_noplugins.ipa
          retention-days: 3
          compression-level: 0

      - name: 發布 IPA Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.ipa \
            --repo "$REPOSITORY" --target "$BUILD_SHA" \
            --title "ThreadsPulse $RELEASE_TAG" \
            --notes 'Unsigned IPA. Sign with your own signing tool before installation.'
